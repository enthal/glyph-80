[package]
name = "fontspace-egui"
description = "Desktop GUI (egui + egui_tiles) over FontSpace's typed operations (spec/12)."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fontspace-gui"
path = "src/main.rs"

[dependencies]
fontspace-model = { path = "../fontspace-model" }
fontspace-ops = { path = "../fontspace-ops" }
fontspace-render = { path = "../fontspace-render" }
fontspace-json = { path = "../fontspace-json" }
# Scan-preset construction for the "Add Export Configuration" action (spec/10).
fontspace-export = { path = "../fontspace-export" }
# Runtime-only per-open-document identity (`DocumentId`, spec/11 §11.1), minted from
# the injected `IdGen`. No `v4` feature — ids come from the generator, never ambient.
uuid = "1"
eframe = "0.35.0"
egui = "0.35.0"
egui_tiles = "0.16.0"
# Native Open/Save file dialogs. Default features use the XDG desktop portal on
# Linux (no GTK build deps) and the native panels on macOS/Windows (spec/12 §12.12).
rfd = "0.17"

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["wgpu", "snapshot"] }
